services:
  redis:
    image: redis:7-alpine
    container_name: rate-limiter-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  demo-api:
    build: .
    container_name: demo-api
    command: ["./demo-api"]
    environment:
      - PORT=8081

  gateway-1:
    build: .
    container_name: gateway-1
    command: ["./gateway"]
    environment:
      - PORT=8080
      - BACKEND_URL=http://demo-api:8081
      - REDIS_ADDR=redis:6379
      - INSTANCE_ID=gateway-1
      - RATE_LIMIT_CAPACITY=1000000
      - RATE_LIMIT_REFILL_RATE=100000
      - FAIL_MODE=closed
    depends_on:
      - redis
      - demo-api

  gateway-2:
    build: .
    container_name: gateway-2
    command: ["./gateway"]
    environment:
      - PORT=8080
      - BACKEND_URL=http://demo-api:8081
      - REDIS_ADDR=redis:6379
      - INSTANCE_ID=gateway-2
      - RATE_LIMIT_CAPACITY=1000000
      - RATE_LIMIT_REFILL_RATE=100000
      - FAIL_MODE=closed
    depends_on:
      - redis
      - demo-api

  gateway-3:
    build: .
    container_name: gateway-3
    command: ["./gateway"]
    environment:
      - PORT=8080
      - BACKEND_URL=http://demo-api:8081
      - REDIS_ADDR=redis:6379
      - INSTANCE_ID=gateway-3
      - RATE_LIMIT_CAPACITY=1000000
      - RATE_LIMIT_REFILL_RATE=100000
      - FAIL_MODE=closed
    depends_on:
      - redis
      - demo-api

  nginx:
    image: nginx:1.27-alpine
    container_name: rate-limiter-nginx
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway-1
      - gateway-2
      - gateway-3

  prometheus:
    image: prom/prometheus:latest
    container_name: rate-limiter-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - gateway-1
      - gateway-2
      - gateway-3

  grafana:
    image: grafana/grafana:latest
    container_name: rate-limiter-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  redis-data:
  grafana-data: